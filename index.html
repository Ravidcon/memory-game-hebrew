<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2a44" />
  <title>משחק זיכרון – פועל ושם הפועל</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1f2a44;
      --muted: #667085;
      --blue: #5b8def;
      --blue-soft: #eaf1ff;
      --green: #5faa72;
      --green-soft: #eaf7ee;
      --gold: #f4c95d;
      --back: #1f2a44;
      --shadow: 0 10px 30px rgba(31, 42, 68, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      background: linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px 14px 40px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 10px;
      align-items: stretch;
      margin: 18px 0 14px;
    }

    .stat, .reset {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: var(--shadow);
      min-height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border: 1px solid rgba(31,42,68,.06);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 700;
    }

    .reset {
      cursor: pointer;
      min-width: 120px;
      background: var(--back);
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      transition: transform .15s ease, opacity .15s ease;
    }

    .reset:hover { transform: translateY(-1px); }
    .reset:active { transform: translateY(0); opacity: .9; }

    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }

    .message {
      text-align: center;
      min-height: 28px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      aspect-ratio: 1.25 / 1;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      perspective: 900px;
      border-radius: 16px;
    }

    .card:focus-visible {
      outline: 4px solid rgba(91,141,239,.35);
      outline-offset: 3px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .42s cubic-bezier(.2,.7,.2,1);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      backface-visibility: hidden;
      box-shadow: 0 8px 20px rgba(31,42,68,.12);
      padding: 10px;
      text-align: center;
      user-select: none;
    }

    .card-back {
      background: linear-gradient(145deg, #273656, #1f2a44);
      color: white;
      font-size: 34px;
      font-weight: 800;
      border: 2px solid rgba(255,255,255,.08);
    }

    .card-front {
      transform: rotateY(180deg);
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 800;
      line-height: 1.2;
      border: 3px solid transparent;
    }

    .card.verb .card-front {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: #214f9f;
    }

    .card.infinitive .card-front {
      background: var(--green-soft);
      border-color: var(--green);
      color: #2e6f40;
    }

    .card.matched .card-front {
      box-shadow: inset 0 0 0 4px var(--gold), 0 8px 20px rgba(31,42,68,.12);
      animation: pop .28s ease;
    }

    @keyframes pop {
      0% { transform: rotateY(180deg) scale(.96); }
      70% { transform: rotateY(180deg) scale(1.04); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20,28,46,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(430px, 100%);
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      padding: 28px;
      text-align: center;
    }

    .modal-card h2 { margin: 0 0 8px; font-size: 30px; }
    .modal-card p { color: var(--muted); font-size: 17px; line-height: 1.5; }
    .modal-card button { margin-top: 8px; }

    @media (max-width: 760px) {
      .board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: repeat(3, 1fr); }
      .reset { grid-column: 1 / -1; }
    }

    @media (max-width: 500px) {
      body { padding-inline: 10px; }
      .board { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
      .card { aspect-ratio: 1.12 / 1; }
      .card-front { font-size: 17px; }
      .card-back { font-size: 28px; }
      .toolbar { gap: 8px; }
      .stat { min-height: 58px; padding: 8px; }
      .stat-value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>משחק זיכרון: פועל ושם הפועל</h1>
      <p class="subtitle">הפכו שני קלפים ומצאו את שם הפועל המתאים לכל פועל.</p>
    </header>

    <section class="toolbar" aria-label="מצב המשחק">
      <div class="stat"><span class="stat-label">זוגות</span><span class="stat-value" id="pairsCount">0 / 15</span></div>
      <div class="stat"><span class="stat-label">מהלכים</span><span class="stat-value" id="movesCount">0</span></div>
      <div class="stat"><span class="stat-label">זמן</span><span class="stat-value" id="timer">00:00</span></div>
      <button class="reset" id="resetBtn" type="button">משחק חדש</button>
    </section>

    <div class="legend" aria-label="מקרא צבעים">
      <span class="legend-item"><span class="dot blue"></span> פועל</span>
      <span class="legend-item"><span class="dot green"></span> שם הפועל</span>
    </div>

    <div class="message" id="message" aria-live="polite"></div>
    <section class="board" id="board" aria-label="לוח משחק הזיכרון"></section>
    <div class="footer-note">זוג נכון נשאר פתוח. זוג לא נכון נסגר אוטומטית.</div>
  </main>

  <div class="modal" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <h2 id="winTitle">כל הכבוד!</h2>
      <p id="winText"></p>
      <button class="reset" id="playAgainBtn" type="button">לשחק שוב</button>
    </div>
  </div>

  <script>
    const pairs = [
      ["הולך", "ללכת"],
      ["יוצא", "לצאת"],
      ["יושבת", "לשבת"],
      ["נכנסים", "להיכנס"],
      ["נוסעות", "לנסוע"],
      ["עומדת", "לעמוד"],
      ["אוהב", "לאהוב"],
      ["רוצה", "לרצות"],
      ["מצטער", "להצטער"],
      ["מכיר", "להכיר"],
      ["יודע", "לדעת"],
      ["משלם", "לשלם"],
      ["מדבר", "לדבר"],
      ["בא", "לבוא"],
      ["גרים", "לגור"]
    ];

    const board = document.getElementById("board");
    const message = document.getElementById("message");
    const pairsCount = document.getElementById("pairsCount");
    const movesCount = document.getElementById("movesCount");
    const timerEl = document.getElementById("timer");
    const resetBtn = document.getElementById("resetBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const winModal = document.getElementById("winModal");
    const winText = document.getElementById("winText");

    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let matchedPairs = 0;
    let moves = 0;
    let seconds = 0;
    let timerId = null;
    let timerStarted = false;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatTime(totalSeconds) {
      const min = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const sec = String(totalSeconds % 60).padStart(2, "0");
      return `${min}:${sec}`;
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;
      timerId = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function createDeck() {
      const deck = [];
      pairs.forEach(([verb, infinitive], pairId) => {
        deck.push({ pairId, text: verb, type: "verb" });
        deck.push({ pairId, text: infinitive, type: "infinitive" });
      });
      return shuffle(deck);
    }

    function makeCard(data, index) {
      const button = document.createElement("button");
      button.className = `card ${data.type}`;
      button.type = "button";
      button.dataset.pairId = String(data.pairId);
      button.dataset.type = data.type;
      button.setAttribute("aria-label", `קלף ${index + 1}`);
      button.innerHTML = `
        <span class="card-inner">
          <span class="card-face card-back">?</span>
          <span class="card-face card-front">${data.text}</span>
        </span>
      `;
      button.addEventListener("click", () => flipCard(button));
      return button;
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      locked = false;
    }

    function updateStats() {
      pairsCount.textContent = `${matchedPairs} / ${pairs.length}`;
      movesCount.textContent = String(moves);
    }

    function flipCard(card) {
      if (locked || card.classList.contains("flipped") || card.classList.contains("matched")) return;

      startTimer();
      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        message.textContent = "בחרו קלף נוסף";
        return;
      }

      secondCard = card;
      locked = true;
      moves++;
      updateStats();

      const samePair = firstCard.dataset.pairId === secondCard.dataset.pairId;
      const differentTypes = firstCard.dataset.type !== secondCard.dataset.type;

      if (samePair && differentTypes) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.setAttribute("aria-label", "זוג שנמצא");
        secondCard.setAttribute("aria-label", "זוג שנמצא");
        matchedPairs++;
        updateStats();
        message.textContent = "מצוין! מצאתם זוג מתאים";
        resetTurn();

        if (matchedPairs === pairs.length) {
          stopTimer();
          setTimeout(() => {
            winText.textContent = `מצאתם את כל ${pairs.length} הזוגות ב-${moves} מהלכים ובזמן ${formatTime(seconds)}.`;
            winModal.classList.add("show");
          }, 400);
        }
      } else {
        message.textContent = "לא מתאים — נסו שוב";
        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          message.textContent = "";
          resetTurn();
        }, 950);
      }
    }

    function startGame() {
      stopTimer();
      firstCard = null;
      secondCard = null;
      locked = false;
      matchedPairs = 0;
      moves = 0;
      seconds = 0;
      timerStarted = false;
      board.innerHTML = "";
      message.textContent = "";
      timerEl.textContent = "00:00";
      winModal.classList.remove("show");
      updateStats();

      createDeck().forEach((cardData, index) => {
        board.appendChild(makeCard(cardData, index));
      });
    }

    resetBtn.addEventListener("click", startGame);
    playAgainBtn.addEventListener("click", startGame);
    winModal.addEventListener("click", (event) => {
      if (event.target === winModal) winModal.classList.remove("show");
    });

    startGame();
  </script>
</body>
</html>
