<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק זיכרון – פועל ושם הפועל</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(180deg,#f5f8fc 0%,#eef3f9 100%);color:#1f2937;min-height:100vh}.container{max-width:1100px;margin:auto;padding:24px 18px 40px}h1{text-align:center;margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#17345c}.instructions{text-align:center;font-size:18px;margin-bottom:18px;line-height:1.6}.legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:20px;font-size:16px}.legend-item{display:flex;align-items:center;gap:7px}.dot{width:16px;height:16px;border-radius:50%}.dot.verb{background:#3b82f6}.dot.infinitive{background:#22a06b}.toolbar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.info-box{background:white;border-radius:12px;padding:10px 16px;min-width:140px;text-align:center;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.07)}.new-game{border:none;border-radius:12px;background:#17345c;color:white;font-size:16px;font-weight:700;padding:11px 20px;cursor:pointer;transition:.2s ease}.new-game:hover{background:#244d83;transform:translateY(-1px)}.message{text-align:center;min-height:32px;margin-bottom:12px;font-size:18px;font-weight:700}.board{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:14px}.card{height:105px;border:none;padding:0;background:transparent;cursor:pointer;perspective:1000px}.card-inner{width:100%;height:100%;position:relative;transition:transform .42s ease;transform-style:preserve-3d}.card.open .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.12)}.card-back{background:linear-gradient(135deg,#17345c,#315d92);border:3px solid white;color:white}.card-back::after{content:"?";font-size:46px;font-weight:800;line-height:1}.card-front{transform:rotateY(180deg);font-size:clamp(20px,2.2vw,28px);font-weight:800;border:4px solid transparent;line-height:1.2;word-break:keep-all}.card.verb .card-front{background:#eaf3ff;border-color:#3b82f6;color:#15437b}.card.infinitive .card-front{background:#eaf8f1;border-color:#22a06b;color:#176547}.card.matched .card-front{box-shadow:inset 0 0 0 4px #f4c542,0 5px 16px rgba(0,0,0,.12)}.card.matched{cursor:default}.finish{display:none;margin:24px auto 0;background:white;border-radius:18px;padding:22px;text-align:center;max-width:560px;box-shadow:0 5px 20px rgba(0,0,0,.1)}.finish.show{display:block}.finish h2{margin-top:0;color:#176547}@media(max-width:820px){.board{grid-template-columns:repeat(4,1fr)}.card{height:95px}}@media(max-width:600px){.container{padding:18px 10px 30px}.instructions{font-size:16px}.board{grid-template-columns:repeat(3,1fr);gap:9px}.card{height:90px}.card-face{border-radius:11px;padding:7px}.card-front{font-size:19px}.card-back::after{font-size:34px}}@media(max-width:370px){.board{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<h1>משחק זיכרון: פועל ושם הפועל</h1>
<div class="instructions">פתחו שני קלפים ומצאו את הפועל ואת שם הפועל המתאים לו.</div>
<div class="legend"><div class="legend-item"><span class="dot verb"></span>פועל</div><div class="legend-item"><span class="dot infinitive"></span>שם הפועל</div></div>
<div class="toolbar"><div class="info-box" id="pairsCount">זוגות: 0 מתוך 15</div><div class="info-box" id="movesCount">מהלכים: 0</div><button class="new-game" onclick="startGame()">משחק חדש</button></div>
<div class="message" id="message"></div>
<div class="board" id="board"></div>
<div class="finish" id="finish"><h2>כל הכבוד!</h2><p id="finishText"></p><button class="new-game" onclick="startGame()">לשחק שוב</button></div>
</div>
<script>
const pairs=[["הולך","ללכת"],["יוצא","לצאת"],["יושבת","לשבת"],["נכנסים","להיכנס"],["נוסעות","לנסוע"],["עומדת","לעמוד"],["אוהב","לאהוב"],["רוצה","לרצות"],["מצטער","להצטער"],["מכיר","להכיר"],["יודע","לדעת"],["משלם","לשלם"],["מדבר","לדבר"],["בא","לבוא"],["גרים","לגור"]];
let firstCard=null,secondCard=null,boardLocked=false,matchedPairs=0,moves=0;
function shuffle(array){const copy=[...array];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function startGame(){firstCard=null;secondCard=null;boardLocked=false;matchedPairs=0;moves=0;document.getElementById("pairsCount").textContent="זוגות: 0 מתוך 15";document.getElementById("movesCount").textContent="מהלכים: 0";document.getElementById("message").textContent="";document.getElementById("finish").classList.remove("show");const cards=[];pairs.forEach((pair,index)=>{cards.push({text:pair[0],pairId:index,type:"verb"});cards.push({text:pair[1],pairId:index,type:"infinitive"})});const board=document.getElementById("board");board.innerHTML="";shuffle(cards).forEach(cardData=>{const card=document.createElement("button");card.className="card "+cardData.type;card.dataset.pairId=cardData.pairId;card.innerHTML=`<div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">${cardData.text}</div></div>`;card.addEventListener("click",()=>handleCardClick(card));board.appendChild(card)})}
function handleCardClick(card){if(boardLocked||card===firstCard||card.classList.contains("matched")||card.classList.contains("open"))return;card.classList.add("open");if(!firstCard){firstCard=card;document.getElementById("message").textContent="עכשיו בחרו את הקלף המתאים.";return}secondCard=card;moves++;document.getElementById("movesCount").textContent="מהלכים: "+moves;checkForMatch()}
function checkForMatch(){boardLocked=true;const isMatch=firstCard.dataset.pairId===secondCard.dataset.pairId;if(isMatch){document.getElementById("message").textContent="מצוין! מצאתם זוג מתאים.";firstCard.classList.add("matched");secondCard.classList.add("matched");matchedPairs++;document.getElementById("pairsCount").textContent=`זוגות: ${matchedPairs} מתוך 15`;firstCard=null;secondCard=null;boardLocked=false;if(matchedPairs===pairs.length)setTimeout(showFinish,400)}else{document.getElementById("message").textContent="לא מתאים. הסתכלו היטב ונסו שוב.";setTimeout(()=>{firstCard.classList.remove("open");secondCard.classList.remove("open");firstCard=null;secondCard=null;boardLocked=false;document.getElementById("message").textContent=""},1200)}}
function showFinish(){document.getElementById("finishText").textContent=`מצאתם את כל 15 הזוגות ב־${moves} מהלכים.`;document.getElementById("finish").classList.add("show");document.getElementById("message").textContent="סיימתם את המשחק בהצלחה!"}
startGame();
</script>
</body>
</html>
